<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Notepad - Notes Tracker & Goals Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Notepad - A simple and beautiful notes tracker integrated with Life is Short. Take notes, manage tasks, and track your daily goals in one place.">
  <meta name="keywords" content="notes tracker, notepad, task tracker, todo list, daily notes, goal tracker, productivity notes, task management">
  <meta name="author" content="Darshan Parmar">
  <meta name="theme-color" content="#4f8cff">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Notepad - Notes Tracker & Goals Tracker">
  <meta property="og:description" content="A simple and beautiful notes tracker integrated with Life is Short. Take notes and manage tasks.">
  <meta property="og:site_name" content="Life is Short">
  
  <link rel="icon" href="../favicon.png" type="image/png">
  <link rel="stylesheet" href="../static/css/style.css?v=17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="../static/js/dev-note.js" defer></script>
  <style>
    .notepad-container {
      display: flex;
      height: calc(100vh - 80px);
      gap: 20px;
      margin-top: 20px;
    }

    .notepad-sidebar {
      width: 250px;
      background-color: var(--surface-color);
      border-radius: 18px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
    }

    .notepad-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .notepad-header h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-item {
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      background-color: transparent;
      border: 1px solid transparent;
      transition: all var(--transition-speed);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-item:hover {
      background-color: var(--surface-hover);
    }

    .note-item.active {
      background-color: rgba(118, 163, 136, 0.18);
      border-color: rgba(118, 163, 136, 0.8);
    }

    .note-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-note-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: none;
    }

    .note-item:hover .delete-note-btn {
      display: block;
    }

    .delete-note-btn:hover {
      color: var(--danger-color);
    }

    .notepad-editor {
      --editor-bg: #f8f8f8;
      --editor-surface: #f3f3f3;
      --editor-toolbar-bg: rgba(255, 255, 255, 0.2);
      --editor-text: #1a1a1a;
      --editor-muted: #727272;
      --editor-border: rgba(0, 0, 0, 0.08);
      --editor-accent: #8db39b;
      --editor-button-bg: rgba(255, 255, 255, 0.58);
      --editor-button-hover: rgba(0, 0, 0, 0.04);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--editor-bg);
      border-radius: 18px;
      border: 1px solid var(--editor-border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    .notepad-editor.dark-theme {
      --editor-bg: #1d1d1d;
      --editor-surface: #222222;
      --editor-toolbar-bg: rgba(255, 255, 255, 0.02);
      --editor-text: #f4f4f4;
      --editor-muted: #b3b3b3;
      --editor-border: rgba(255, 255, 255, 0.08);
      --editor-accent: #a2d0b0;
      --editor-button-bg: rgba(255, 255, 255, 0.04);
      --editor-button-hover: rgba(255, 255, 255, 0.08);
    }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--editor-border);
      padding: 16px 18px 12px;
      background: var(--editor-toolbar-bg);
    }

    .tool-group-right {
      margin-left: auto;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 8px;
      border-right: 1px solid var(--editor-border);
    }

    .tool-group:last-child {
      border-right: none;
      padding-right: 0;
    }

    .tool-select,
    .tool-btn,
    .action-btn,
    .theme-toggle,
    .font-size-btn,
    .color-panel input[type="color"],
    .font-size-input {
      background: transparent;
      border: 1px solid transparent;
      color: var(--editor-text);
      border-radius: 10px;
      cursor: pointer;
      transition: all var(--transition-speed);
      font-family: 'Inter', sans-serif;
    }

    .tool-select {
      min-width: 118px;
      padding: 8px 10px;
      border-color: var(--editor-border);
      background: var(--editor-button-bg);
      color: var(--editor-text);
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      outline: none;
    }

    .tool-select option {
      background: var(--editor-surface);
      color: var(--editor-text);
    }

    .tool-btn,
    .theme-toggle,
    .font-size-btn {
      width: 30px;
      height: 30px;
      padding: 0;
      font-size: 1rem;
      background: var(--editor-button-bg);
      border-color: var(--editor-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tool-btn:hover,
    .action-btn:hover,
    .theme-toggle:hover,
    .font-size-btn:hover,
    .color-panel:hover {
      background-color: var(--editor-button-hover);
      border-color: var(--editor-border);
    }

    .doc-surface {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 10px 18px 18px;
      background: var(--editor-surface);
      overflow: hidden;
    }

    .editor-title {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--editor-text);
      padding: 8px 0 12px;
      font-family: 'Inter', sans-serif;
    }

    .editor-title:focus {
      outline: none;
    }

    .editor-content {
      flex: 1;
      min-height: 0;
      background: transparent;
      border: none;
      resize: none;
      font-size: 1.1rem;
      color: var(--editor-text);
      font-family: 'Inter', sans-serif;
      line-height: 1.7;
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .editor-content:empty:before {
      content: attr(data-placeholder);
      color: var(--editor-muted);
    }

    .doc-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 18px 18px;
      flex-wrap: wrap;
      flex-shrink: 0;
      background: var(--editor-bg);
    }

    .action-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      border-color: var(--editor-border);
      padding: 10px 14px;
      background: var(--editor-button-bg);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Checklist / checkbox inside the editor */
    .editor-check-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 2px 0;
      padding: 0;
      line-height: 1.7;
      min-height: 1.7em;
      width: 100%;
    }

    .editor-check-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      margin: 5px 0 0 2px;
      cursor: pointer;
      accent-color: #188038;
      flex: 0 0 auto;
    }

    .editor-check-item .checkbox-text {
      min-width: 2px;
      flex: 1;
      outline: none;
    }

    .editor-check-item input[type="checkbox"]:checked + .checkbox-text {
      text-decoration: line-through;
      opacity: 0.65;
    }

    .editor-normal-line {
      min-height: 1.7em;
      line-height: 1.7;
      width: 100%;
    }

    /* Google-Docs-style text color palette */
    .color-tool-group {
      position: relative;
    }

    .text-color-palette {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 360px;
      padding: 12px 12px 14px;
      background: var(--editor-surface);
      border: 1px solid var(--editor-border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      z-index: 1000;
      display: none;
    }

    .text-color-palette.open {
      display: block;
    }

    .palette-none {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px 10px;
      margin: 0 0 8px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--editor-border);
      color: var(--editor-text);
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
    }

    .palette-none:hover {
      background: var(--editor-button-hover);
    }

    .none-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 1rem;
      background: #fff;
      border: 1px solid #ddd;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
    }

    .palette-swatch,
    .custom-color-swatch,
    .custom-color-add {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.12);
      padding: 0;
      cursor: pointer;
      box-sizing: border-box;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .palette-swatch:hover,
    .custom-color-swatch:hover,
    .custom-color-add:hover {
      transform: scale(1.08);
      box-shadow: 0 0 0 2px var(--editor-surface), 0 0 0 3px var(--editor-accent);
    }

    .palette-swatch.white {
      border-color: rgba(0, 0, 0, 0.25);
    }

    .palette-custom-label {
      margin: 14px 0 8px 4px;
      color: var(--editor-text);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .palette-custom {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 4px;
      position: relative;
    }

    .custom-color-add {
      background: var(--editor-surface);
      color: var(--editor-text);
      border: 2px solid #666;
      font-size: 25px;
      font-weight: 400;
      line-height: 26px;
    }

    .palette-custom input[type="color"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .text-color-palette {
        width: min(360px, calc(100vw - 30px));
        left: -60px;
      }

      .palette-swatch,
      .custom-color-swatch,
      .custom-color-add {
        width: 28px;
        height: 28px;
      }
    }

    .color-panel {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--editor-border);
      border-radius: 10px;
      background: var(--editor-button-bg);
      padding: 6px 10px;
      color: var(--editor-text);
    }

    .color-panel label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }

    .color-panel input[type="color"] {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      padding: 0;
      min-width: 28px;
      border-radius: 8px;
      overflow: hidden;
    }

    .font-size-input {
      width: 52px;
      height: 30px;
      padding: 0 4px;
      text-align: center;
      font-size: 0.95rem;
      background: var(--editor-button-bg);
      border-color: var(--editor-border);
      -moz-appearance: textfield;
    }

    .font-size-input::-webkit-outer-spin-button,
    .font-size-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .font-size-input:focus {
      outline: none;
      border-color: var(--editor-accent);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 15px;
      color: var(--border-color);
    }

    .note-item {
      position: relative;
      gap: 10px;
    }

    .note-item-main {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .note-index {
      min-width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(118, 163, 136, 0.18);
      color: var(--text-color);
      border: 1px solid rgba(118, 163, 136, 0.3);
    }

    .note-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .move-note-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Sub-notes: a lightweight, Google-Docs-style nested note under a
       parent note, indented one level in the sidebar list. */
    .note-item-sub {
      margin-left: 24px;
      padding-top: 8px;
      padding-bottom: 8px;
    }

    .note-item-sub .note-index {
      min-width: 18px;
      height: 18px;
    }

    .subnote-icon {
      color: var(--text-muted);
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .add-subnote-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: none;
    }

    .note-item:hover .add-subnote-btn {
      display: block;
    }

    .add-subnote-btn:hover {
      color: var(--text-color);
    }

    /* Fixed corner credit / developer-note trigger, always visible in the
       bottom-left corner regardless of sidebar state. */
    .dev-note-corner {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      cursor: pointer;
      transition: all var(--transition-speed);
    }

    .dev-note-corner:hover {
      color: var(--text-color);
      border-color: rgba(118, 163, 136, 0.8);
      transform: translateY(-1px);
    }

    @media (max-width: 768px) {
      .dev-note-corner {
        left: 10px;
        bottom: 10px;
        padding: 6px 10px;
        font-size: 0.72rem;
      }
    }

    @media (max-width: 768px) {
      .notepad-container {
        flex-direction: column;
        height: auto;
      }

      .notepad-sidebar {
        width: 100%;
        max-height: 220px;
      }

      .notepad-editor {
        min-height: 420px;
      }

      .doc-actions {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
      </button>
    </div>
    <div class="sidebar-content">
      <a href="../index.html" class="sidebar-link" title="Home" aria-label="Home"><i class="fa-solid fa-house"></i></a>
      <a href="../calendar/" class="sidebar-link" title="Life Calendar" aria-label="Life Calendar"><i
          class="fa-solid fa-calendar"></i></a>

      <div class="sidebar-bottom"
        style="margin-top: auto; display: flex; flex-direction: column; align-items: center; width: 100%;">
        <button class="sidebar-link" id="theme-toggle" title="Switch to light mode" aria-label="Switch to light mode"
          aria-pressed="true"><i class="fa-solid fa-sun"></i></button>
        <button class="refresh-btn" id="refresh-btn" title="Reset all saved data" aria-label="Reset all saved data"
          style="margin-top: 0;"><i class="fa-solid fa-rotate-left"></i></button>
      </div>
    </div>
  </div>

  <main>
    <header class="site-header">
      <span>Notepad</span>
      <a class="credit-link" href="#" data-dev-note-trigger title="Developer Note" aria-label="Open developer note" role="button" onclick="window.openDeveloperNoteModal && window.openDeveloperNoteModal(event); return false;">
        <i class="fa-brands fa-github"></i> Developer Note
      </a>
    </header>

    <div class="notepad-container">
      <div class="notepad-sidebar">
        <div class="notepad-header">
          <h3>My Notes</h3>
          <button class="small-btn" id="add-note-btn" title="Add new note">+</button>
        </div>
        <div class="notes-list" id="notes-list">
          <!-- Note items will be added here -->
        </div>
      </div>

      <div class="notepad-editor" id="notepad-editor">
        <!-- Editor or empty state will be shown here -->
      </div>
    </div>
  </main>

  <script>
    function buildToolbarMarkup(note) {
      const currentTheme = note.theme || 'dark';
      const themeIcon = currentTheme === 'dark' ? 'sun' : 'moon';
      const currentSize = String(note.fontSize || 12);
      return `
        <div class="editor-toolbar">
          <div class="tool-group">
            <button class="tool-btn" type="button" title="Undo" data-command="undo"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="tool-btn" type="button" title="Redo" data-command="redo"><i class="fa-solid fa-rotate-right"></i></button>
          </div>
          <div class="tool-group">
            <select class="tool-select" aria-label="Text style" data-style-select>
              <option value="default">Default</option>
              <option value="h1">Heading 1</option>
              <option value="h2">Heading 2</option>
            </select>
          </div>
          <div class="tool-group">
            <button class="font-size-btn" type="button" title="Decrease font size" data-size="decrease">−</button>
            <input class="font-size-input" type="number" min="6" max="300" step="1" title="Font size (type any number)" data-size-input value="${currentSize}">
            <button class="font-size-btn" type="button" title="Increase font size" data-size="increase">+</button>
          </div>
          <div class="tool-group">
            <button class="tool-btn" type="button" title="Bold" data-command="bold"><strong>B</strong></button>
            <button class="tool-btn" type="button" title="Italic" data-command="italic"><em>I</em></button>
            <button class="tool-btn" type="button" title="Underline" data-command="underline"><span style="text-decoration: underline;">U</span></button>
            <button class="tool-btn" type="button" title="Strikethrough" data-command="strikeThrough"><span style="text-decoration: line-through;">S</span></button>
          </div>
          <div class="tool-group">
            <button class="tool-btn" type="button" title="Insert checkbox" data-checkbox-tool aria-label="Insert checkbox">
              <i class="fa-regular fa-square-check"></i>
            </button>
          </div>
          <div class="tool-group color-tool-group">
            <button class="tool-btn" type="button" title="Text color" data-color-trigger aria-label="Text color">
              <i class="fa-solid fa-droplet"></i>
            </button>
            <div class="text-color-palette" data-color-palette role="dialog" aria-label="Text color palette">
              <button type="button" class="palette-none" data-color-value="inherit">
                <span class="none-icon"><i class="fa-solid fa-ban"></i></span>
                <span>None</span>
              </button>
              <div class="palette-grid" data-palette-grid></div>
              <div class="palette-custom-label">CUSTOM</div>
              <div class="palette-custom">
                <button type="button" class="custom-color-swatch" data-custom-color="#b7b7b7" data-color-value="#b7b7b7" aria-label="Custom gray" title="Custom gray"></button>
                <button type="button" class="custom-color-swatch" data-custom-color="#188038" data-color-value="#188038" aria-label="Custom green" title="Custom green"></button>
                <button type="button" class="custom-color-add" data-custom-color-add aria-label="Choose custom color" title="Choose custom color">+</button>
                <input type="color" value="#1a1a1a" data-color-picker aria-label="Pick custom text color">
              </div>
            </div>
          </div>
          <div class="tool-group">
            <button class="tool-btn" type="button" title="Align left" data-command="justifyLeft"><i class="fa-solid fa-align-left"></i></button>
            <button class="tool-btn" type="button" title="Align center" data-command="justifyCenter"><i class="fa-solid fa-align-center"></i></button>
            <button class="tool-btn" type="button" title="Align right" data-command="justifyRight"><i class="fa-solid fa-align-right"></i></button>
          </div>
          <div class="tool-group">
            <button class="tool-btn" type="button" title="Bullet list" data-command="insertUnorderedList"><i class="fa-solid fa-list"></i></button>
            <button class="tool-btn" type="button" title="Number list" data-command="insertOrderedList"><i class="fa-solid fa-list-ol"></i></button>
          </div>
          <div class="tool-group tool-group-right">
            <button class="theme-toggle" type="button" title="Switch editor theme" data-theme-toggle><i class="fa-solid fa-${themeIcon}"></i></button>
            <button type="button" class="action-btn" data-action="copy"><i class="fa-regular fa-copy"></i></button>
          </div>
        </div>
      `;
    }

    function buildEditorMarkup(note) {
      return `
        ${buildToolbarMarkup(note)}
        <div class="doc-surface">
          <input type="text" class="editor-title" id="editor-title" placeholder="Note title" value="${escapeHtml(note.title || 'Untitled Note')}">
          <div class="editor-content" id="editor-content" contenteditable="true" spellcheck="false" data-placeholder="Write your note here" lang="en" dir="ltr">${note.content || ''}</div>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Theme and Sidebar Initialization
    function applyTheme(theme) {
      const dark = theme === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      const toggle = document.getElementById('theme-toggle');
      toggle.setAttribute('aria-pressed', String(dark));
      toggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      toggle.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
      toggle.innerHTML = `<i class="fa-solid fa-${dark ? 'sun' : 'moon'}"></i>`;
    }

    applyTheme(localStorage.getItem('theme') || 'dark');

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', theme);
      applyTheme(theme);
    });

    document.getElementById('refresh-btn').addEventListener('click', () => {
      const shouldReset = confirm('This will erase all saved goals, calendar data, notes, and preferences. Continue?');
      if (shouldReset) {
        localStorage.clear();
        window.location.reload();
      }
    });

    const sidebar = document.querySelector('.sidebar');
    const main = document.querySelector('main');
    // Sidebar always starts collapsed on every load; it no longer remembers a previous state.

    document.getElementById('sidebar-toggle').addEventListener('click', () => {
      sidebar.classList.toggle('expanded');
      main.classList.toggle('expanded');
    });

    window.addEventListener('scroll', () => hideSuggestionBox(), true);
    window.addEventListener('resize', () => hideSuggestionBox());

    // Notepad Functionality
    let notes = JSON.parse(localStorage.getItem('life_notes')) || [];
    let activeNoteId = null;

    const notesList = document.getElementById('notes-list');
    const notepadEditor = document.getElementById('notepad-editor');
    const addNoteBtn = document.getElementById('add-note-btn');

    function saveNotes() {
      localStorage.setItem('life_notes', JSON.stringify(notes));
    }

    function renderNoteRow(note, indexLabel, isSub) {
      const div = document.createElement('div');
      div.className = `note-item ${isSub ? 'note-item-sub' : ''} ${note.id === activeNoteId ? 'active' : ''}`.trim();
      div.innerHTML = `
        <div class="note-item-main">
          ${isSub
            ? '<i class="fa-solid fa-turn-down subnote-icon" aria-hidden="true"></i>'
            : `<span class="note-index">${indexLabel}</span>`}
          <div class="note-item-title">${note.title || 'Untitled Note'}</div>
        </div>
        <div class="note-controls">
          ${isSub ? '' : '<button class="add-subnote-btn" data-add-sub title="Add sub-note" aria-label="Add sub-note"><i class="fa-solid fa-plus"></i></button>'}
          <button class="move-note-btn" data-move="up" title="Move up" aria-label="Move up">↑</button>
          <button class="move-note-btn" data-move="down" title="Move down" aria-label="Move down">↓</button>
          <button class="delete-note-btn" title="Delete Note" aria-label="Delete Note"><i class="fa-solid fa-trash"></i></button>
        </div>
      `;

      div.addEventListener('click', (e) => {
        const addSubButton = e.target.closest('[data-add-sub]');
        if (addSubButton) {
          createSubNote(note.id);
          return;
        }
        const moveButton = e.target.closest('[data-move]');
        if (moveButton) {
          moveNote(note.id, moveButton.dataset.move);
          return;
        }
        if (e.target.closest('.delete-note-btn')) {
          deleteNote(note.id);
          return;
        }
        setActiveNote(note.id);
      });

      notesList.appendChild(div);
    }

    function renderNotesList() {
      notesList.innerHTML = '';
      if (notes.length === 0) {
        notesList.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9em; text-align: center; margin-top: 20px;">No notes yet</div>';
        return;
      }

      // Top-level notes render in order, each immediately followed by its
      // own sub-notes (also in order) - a single level of Google-Docs-style
      // nesting under the parent note.
      const topLevelNotes = notes.filter(note => !note.parentId);
      let topLevelIndex = 0;

      topLevelNotes.forEach((note) => {
        topLevelIndex += 1;
        renderNoteRow(note, topLevelIndex, false);

        const subNotes = notes.filter(n => n.parentId === note.id);
        subNotes.forEach((subNote) => renderNoteRow(subNote, null, true));
      });
    }

    function moveNote(id, direction) {
      const note = notes.find(n => n.id === id);
      if (!note) return;

      // Move within siblings only (same parent) so top-level notes and
      // sub-notes never jump into each other's group.
      const parentId = note.parentId || null;
      const siblingIds = notes.filter(n => (n.parentId || null) === parentId).map(n => n.id);
      const posInSiblings = siblingIds.indexOf(id);
      const targetPos = direction === 'up' ? posInSiblings - 1 : posInSiblings + 1;
      if (targetPos < 0 || targetPos >= siblingIds.length) return;

      const otherId = siblingIds[targetPos];
      const currentIndex = notes.findIndex(n => n.id === id);
      const otherIndex = notes.findIndex(n => n.id === otherId);
      [notes[currentIndex], notes[otherIndex]] = [notes[otherIndex], notes[currentIndex]];

      saveNotes();
      renderNotesList();
      setActiveNote(id);
    }

    function applyNoteTheme(theme) {
      const normalizedTheme = theme === 'dark' ? 'dark' : 'light';
      notepadEditor.classList.toggle('dark-theme', normalizedTheme === 'dark');

      const note = notes.find(item => item.id === activeNoteId);
      if (note && note.theme !== normalizedTheme) {
        note.theme = normalizedTheme;
        saveNotes();
      }

      const toggleButton = notepadEditor.querySelector('[data-theme-toggle]');
      if (toggleButton) {
        toggleButton.innerHTML = `<i class="fa-solid fa-${normalizedTheme === 'dark' ? 'sun' : 'moon'}"></i>`;
        toggleButton.title = normalizedTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      }

      const colorInput = notepadEditor.querySelector('[data-color-picker]');
      if (colorInput) {
        colorInput.value = normalizedTheme === 'dark' ? '#f4f4f4' : '#1a1a1a';
      }
    }

    function updateFontSize(nextSize) {
      const contentInput = document.getElementById('editor-content');
      if (!contentInput) return;

      const safeSize = Math.min(300, Math.max(6, Math.round(Number(nextSize)) || 12));
      const note = notes.find(item => item.id === activeNoteId);
      if (note) {
        note.fontSize = safeSize;
        saveNotes();
      }
      const sizeInput = document.querySelector('[data-size-input]');
      if (sizeInput && Number(sizeInput.value) !== safeSize) sizeInput.value = String(safeSize);
      contentInput.style.fontSize = `${safeSize}px`;
    }

    function insertTextAtCursor(text) {
      const contentInput = document.getElementById('editor-content');
      if (!contentInput) return;
      contentInput.focus();
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) {
        document.execCommand('insertText', false, text);
        return;
      }
      const range = selection.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
      selection.removeAllRanges();
      selection.addRange(range);
      contentInput.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function renderEditor() {
      if (!activeNoteId) {
        notepadEditor.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-book-open"></i>
            <p>Select a note or create a new one.</p>
          </div>
        `;
        return;
      }

      const note = notes.find(n => n.id === activeNoteId);
      if (!note) return;

      note.theme = note.theme || 'dark';
      note.fontSize = note.fontSize || 12;
      notepadEditor.innerHTML = buildEditorMarkup(note);
      applyNoteTheme(note.theme);

      const titleInput = document.getElementById('editor-title');
      const contentInput = document.getElementById('editor-content');
      const currentSize = Number(note.fontSize || 12);
      contentInput.style.fontFamily = 'Inter, sans-serif';
      contentInput.style.fontSize = `${currentSize}px`;

      titleInput.addEventListener('input', (e) => {
        note.title = e.target.value;
        saveNotes();
        renderNotesList();
      });

      contentInput.addEventListener('input', (e) => {
        note.content = e.target.innerHTML;
        saveNotes();
      });

      function getCheckboxItemFromNode(node) {
        if (!node) return null;
        const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
        return element ? element.closest('.editor-check-item') : null;
      }

      function getCheckboxTextElement(item) {
        return item ? item.querySelector('.checkbox-text') : null;
      }

      function isCaretAtStart(element, range) {
        if (!element || !range || !range.collapsed) return false;
        const probe = range.cloneRange();
        probe.selectNodeContents(element);
        probe.setEnd(range.startContainer, range.startOffset);
        return probe.toString().length === 0;
      }

      function isCaretAtEnd(element, range) {
        if (!element || !range || !range.collapsed) return false;
        const probe = range.cloneRange();
        probe.selectNodeContents(element);
        probe.setStart(range.endContainer, range.endOffset);
        return probe.toString().length === 0;
      }

      function placeCaretAtStart(element) {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(element);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
        contentInput.focus();
      }

      function placeCaretAtEnd(element) {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(element);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
        contentInput.focus();
      }

      function convertCheckboxToNormalParagraph(item) {
        if (!item) return null;
        const text = getCheckboxTextElement(item);
        if (!text) return null;

        const paragraph = document.createElement('div');
        paragraph.className = 'editor-normal-line';
        while (text.firstChild) paragraph.appendChild(text.firstChild);
        item.replaceWith(paragraph);
        return paragraph;
      }

      function splitCheckboxAtCaret(item, textElement, range) {
        const beforeRange = range.cloneRange();
        beforeRange.selectNodeContents(textElement);
        beforeRange.setEnd(range.startContainer, range.startOffset);

        const afterRange = range.cloneRange();
        afterRange.selectNodeContents(textElement);
        afterRange.setStart(range.startContainer, range.startOffset);

        const before = beforeRange.cloneContents();
        const after = afterRange.cloneContents();
        const beforeEmpty = !before.textContent;
        const afterEmpty = !after.textContent;

        // Pressing Enter on a completely empty checklist item exits the
        // list, the same way Google Docs turns an empty checkbox/bullet
        // back into a normal paragraph instead of stacking another empty
        // checkbox underneath it.
        if (beforeEmpty && afterEmpty) {
          const normal = convertCheckboxToNormalParagraph(item);
          placeCaretAtEnd(normal);
          note.content = contentInput.innerHTML;
          saveNotes();
          return;
        }

        // Pressing Enter at the very start of a non-empty item pushes the
        // existing text down and inserts a new, empty checkbox above it -
        // matching Google Docs, instead of losing the checkbox formatting.
        if (beforeEmpty) {
          const newItem = createCheckboxItem(null);
          item.parentNode.insertBefore(newItem, item);
          placeCaretAtStart(textElement);
          note.content = contentInput.innerHTML;
          saveNotes();
          return;
        }

        textElement.innerHTML = '';
        textElement.appendChild(before);

        const newItem = createCheckboxItem(after);
        item.parentNode.insertBefore(newItem, item.nextSibling);

        const newText = getCheckboxTextElement(newItem);
        placeCaretAtStart(newText);

        note.content = contentInput.innerHTML;
        saveNotes();
      }

      // Erasing a text SELECTION that happens to span a checkbox row (e.g.
      // triple-clicking a checklist line, or Ctrl+A across the whole note)
      // must never silently delete the checkbox itself along with the
      // text - only the text should go. This finds every checkbox <input>
      // whose row is touched by the given range.
      function checkboxInputsInRange(range) {
        const checkboxes = Array.from(contentInput.querySelectorAll('.editor-check-item > input[type="checkbox"]'));
        return checkboxes.filter((checkbox) => {
          const nodeRange = document.createRange();
          nodeRange.selectNode(checkbox);
          return range.compareBoundaryPoints(Range.END_TO_START, nodeRange) < 0 &&
            range.compareBoundaryPoints(Range.START_TO_END, nodeRange) > 0;
        });
      }

      // Deletes the text a selection covers without ever removing a
      // checkbox <input> node as a side effect. Any checklist row left with
      // no text keeps the row (as a plain, checkbox-free line) instead of
      // vanishing from the note - it only ever loses the checkbox, never
      // the row/sentence itself.
      function handleCheckboxRangeDeletion(range) {
        const involvedCheckboxes = checkboxInputsInRange(range);
        if (!involvedCheckboxes.length) return false;

        const items = [];
        involvedCheckboxes.forEach((checkbox) => {
          const item = checkbox.closest('.editor-check-item');
          if (item && !items.includes(item)) items.push(item);
        });
        items.sort((a, b) => {
          const position = a.compareDocumentPosition(b);
          if (position & Node.DOCUMENT_POSITION_FOLLOWING) return -1;
          if (position & Node.DOCUMENT_POSITION_PRECEDING) return 1;
          return 0;
        });

        const firstItem = items[0];
        const lastItem = items[items.length - 1];
        const firstText = getCheckboxTextElement(firstItem);

        // Text before the selection start, if the selection began inside
        // the first affected row's label (rather than before its checkbox).
        let leadingText = '';
        if (firstText && firstText.contains(range.startContainer)) {
          const leadRange = range.cloneRange();
          leadRange.selectNodeContents(firstText);
          leadRange.setEnd(range.startContainer, range.startOffset);
          leadingText = leadRange.toString();
        }

        // Content after the selection end, if it ended inside the last
        // affected row's label (rather than after its checkbox text).
        const lastText = getCheckboxTextElement(lastItem);
        let trailingFragment = null;
        if (lastText && lastText.contains(range.endContainer)) {
          const trailRange = range.cloneRange();
          trailRange.selectNodeContents(lastText);
          trailRange.setStart(range.endContainer, range.endOffset);
          trailingFragment = trailRange.cloneContents();
        }

        // Every fully-covered row in between (and the last row, if it was
        // reduced to nothing) is removed outright; only the first row is
        // reused to hold whatever text survives on either side.
        items.slice(1).forEach((item) => item.remove());

        const survivingHasText = !!(leadingText || (trailingFragment && trailingFragment.textContent));

        if (firstText) {
          firstText.innerHTML = '';
          if (leadingText) firstText.appendChild(document.createTextNode(leadingText));
          if (trailingFragment) firstText.appendChild(trailingFragment);
        }

        if (!survivingHasText) {
          // Nothing left in the row - drop just the checkbox, keep an
          // empty editable line in its place.
          const normal = convertCheckboxToNormalParagraph(firstItem);
          placeCaretAtStart(normal);
        } else if (firstText) {
          const selection = window.getSelection();
          const caretRange = document.createRange();
          if (leadingText && firstText.firstChild) {
            caretRange.setStart(firstText.firstChild, leadingText.length);
          } else {
            caretRange.selectNodeContents(firstText);
            caretRange.collapse(true);
          }
          caretRange.collapse(true);
          selection.removeAllRanges();
          selection.addRange(caretRange);
          contentInput.focus();
        }

        note.content = contentInput.innerHTML;
        saveNotes();
        return true;
      }

      contentInput.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          document.execCommand('insertHTML', false, '&emsp;');
          return;
        }

        // Make checklist behavior work like a normal document editor:
        // Enter creates another checkbox; Backspace at the beginning removes
        // the checkbox but keeps the text.
        if (e.key === 'Enter' && !e.shiftKey) {
          const selection = window.getSelection();
          if (selection && selection.rangeCount) {
            const range = selection.getRangeAt(0);
            const item = getCheckboxItemFromNode(range.startContainer);
            const textElement = getCheckboxTextElement(item);

            if (item && textElement && item.contains(range.endContainer)) {
              e.preventDefault();
              e.stopPropagation();

              if (!range.collapsed) {
                range.deleteContents();
              }

              const currentRange = selection.getRangeAt(0).cloneRange();
              splitCheckboxAtCaret(item, textElement, currentRange);
              return;
            }
          }
        }

        if ((e.key === 'Backspace' || e.key === 'Delete') && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const selection = window.getSelection();
          if (selection && selection.rangeCount) {
            const range = selection.getRangeAt(0);

            if (!range.collapsed) {
              // A text selection (drag, double/triple-click, or Ctrl+A)
              // that touches a checkbox row must only erase the text -
              // never the checkbox itself.
              if (handleCheckboxRangeDeletion(range)) {
                e.preventDefault();
                e.stopImmediatePropagation();
              }
              return;
            }
          }
        }

        if (e.key === 'Backspace' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const selection = window.getSelection();
          if (selection && selection.rangeCount) {
            const range = selection.getRangeAt(0);
            const item = getCheckboxItemFromNode(range.startContainer);
            const textElement = getCheckboxTextElement(item);

            if (item && textElement && item.contains(range.endContainer) && range.collapsed) {
              // A real checklist behaves like a paragraph/list item.
              // At the beginning of the label, Backspace removes the
              // checklist formatting instead of getting stuck.
              if (isCaretAtStart(textElement, range)) {
                e.preventDefault();
                e.stopImmediatePropagation();

                const previousItem = item.previousElementSibling;
                const text = textElement.textContent || '';

                // If the checklist item is empty, remove the whole item.
                if (!text.trim() && item.parentNode) {
                  if (previousItem && previousItem.classList.contains('editor-check-item')) {
                    const previousText = getCheckboxTextElement(previousItem);
                    item.remove();
                    placeCaretAtEnd(previousText);
                  } else {
                    const normal = document.createElement('div');
                    normal.className = 'editor-normal-line';
                    item.replaceWith(normal);
                    placeCaretAtStart(normal);
                  }
                } else {
                  // Non-empty item: keep all text/formatting, only remove
                  // the checkbox wrapper. This is the same practical
                  // behavior as turning a Word/Docs checklist item into
                  // a normal paragraph with Backspace at its start.
                  const normal = convertCheckboxToNormalParagraph(item);
                  placeCaretAtStart(normal);
                }

                note.content = contentInput.innerHTML;
                saveNotes();
                return;
              }

              // If the label is empty and Backspace is pressed anywhere in
              // it, remove the empty checklist item.
              if (!textElement.textContent.trim()) {
                e.preventDefault();
                e.stopImmediatePropagation();
                const previous = item.previousElementSibling;
                item.remove();
                if (previous) {
                  const previousText = previous.classList.contains('editor-check-item')
                    ? getCheckboxTextElement(previous)
                    : previous;
                  placeCaretAtEnd(previousText);
                }
                note.content = contentInput.innerHTML;
                saveNotes();
                return;
              }
            }
          }
        }
      });

      contentInput.addEventListener('blur', () => {});
      contentInput.addEventListener('mouseup', () => {});

      titleInput.addEventListener('keydown', () => {});
      titleInput.addEventListener('blur', () => {});
      titleInput.addEventListener('click', () => {});

      function convertCheckItemsToList(items, listTag) {
        if (!items.length) return;

        const list = document.createElement(listTag);
        items.forEach((item) => {
          const textEl = getCheckboxTextElement(item);
          const li = document.createElement('li');
          if (textEl) {
            while (textEl.firstChild) li.appendChild(textEl.firstChild);
          }
          list.appendChild(li);
        });

        items[0].parentNode.insertBefore(list, items[0]);
        items.forEach((item) => item.remove());

        const lastLi = list.lastElementChild;
        if (lastLi) placeCaretAtEnd(lastLi);

        note.content = contentInput.innerHTML;
        saveNotes();
      }

      document.querySelectorAll('.tool-btn').forEach(button => {
        button.addEventListener('click', () => {
          const command = button.dataset.command;
          if (!command) return;

          // Native list commands don't understand our custom checklist
          // markup (a div with a checkbox input inside it) and produce a
          // broken result. When the selection is inside checklist items,
          // convert them into a real list ourselves instead - same outcome
          // as Google Docs turning a checklist back into a bullet list.
          if (command === 'insertUnorderedList' || command === 'insertOrderedList') {
            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0 && contentInput.contains(selection.anchorNode)) {
              const range = selection.getRangeAt(0);
              const startItem = getCheckboxItemFromNode(range.startContainer);
              const endItem = getCheckboxItemFromNode(range.endContainer);

              if (startItem && endItem) {
                const spanned = [];
                let node = startItem;
                while (node) {
                  spanned.push(node);
                  if (node === endItem) break;
                  node = node.nextElementSibling;
                }

                if (spanned[spanned.length - 1] === endItem) {
                  convertCheckItemsToList(spanned, command === 'insertOrderedList' ? 'ol' : 'ul');
                  contentInput.focus();
                  return;
                }
              }
            }
          }

          document.execCommand(command, false, null);
          contentInput.focus();
        });
      });

      const sizeInput = document.querySelector('[data-size-input]');
      document.querySelectorAll('[data-size]').forEach(button => {
        button.addEventListener('click', () => {
          const current = Number((sizeInput && sizeInput.value) || note.fontSize || 12);
          if (button.dataset.size === 'increase') {
            updateFontSize(current + 1);
          } else if (button.dataset.size === 'decrease') {
            updateFontSize(current - 1);
          }
          contentInput.focus();
        });
      });

      if (sizeInput) {
        sizeInput.addEventListener('input', () => {
          if (sizeInput.value === '') return;
          updateFontSize(sizeInput.value);
        });
        sizeInput.addEventListener('blur', () => {
          updateFontSize(sizeInput.value);
        });
        sizeInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            updateFontSize(sizeInput.value);
            contentInput.focus();
          }
        });
      }

      // Insert checkbox items without deleting selected text.
      // Every selected line becomes its own checklist item, like a bullet list.
      const checkboxTool = document.querySelector('[data-checkbox-tool]');
      let savedCheckboxRange = null;

      function saveEditorSelection() {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0) return;
        const range = selection.getRangeAt(0);
        if (contentInput.contains(range.commonAncestorContainer)) {
          savedCheckboxRange = range.cloneRange();
        }
      }

      function createCheckboxItem(contents) {
        const item = document.createElement('div');
        item.className = 'editor-check-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.setAttribute('contenteditable', 'false');
        checkbox.setAttribute('aria-label', 'Checklist checkbox');

        const text = document.createElement('span');
        text.className = 'checkbox-text';
        text.setAttribute('contenteditable', 'true');

        if (contents) {
          text.appendChild(contents);
        }

        item.appendChild(checkbox);
        item.appendChild(text);
        return item;
      }

      function splitSelectedContentIntoLines(fragment) {
        const wrapper = document.createElement('div');
        wrapper.appendChild(fragment.cloneNode(true));

        const lines = [];
        let current = document.createDocumentFragment();

        const pushLine = () => {
          lines.push(current);
          current = document.createDocumentFragment();
        };

        const blockTags = new Set([
          'DIV', 'P', 'LI', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
          'BLOCKQUOTE', 'PRE'
        ]);

        const appendNode = (node) => {
          if (node.nodeType === Node.TEXT_NODE) {
            const parts = node.textContent.split(/\r?\n/);

            parts.forEach((part, index) => {
              if (part) {
                current.appendChild(document.createTextNode(part));
              }
              if (index < parts.length - 1) {
                pushLine();
              }
            });
            return;
          }

          if (node.nodeType !== Node.ELEMENT_NODE) {
            return;
          }

          if (node.tagName === 'BR') {
            pushLine();
            return;
          }

          if (blockTags.has(node.tagName)) {
            // A block element represents one editor line/paragraph.
            // Copy its children so formatting such as bold/italic is preserved.
            Array.from(node.childNodes).forEach(child => appendNode(child));

            // End this block as a separate checklist item.
            pushLine();
            return;
          }

          if (node.tagName === 'UL' || node.tagName === 'OL') {
            // Don't treat the list wrapper itself as content - unwrap it so
            // each <li> becomes its own checklist item below. Leaving the
            // wrapper in place is what caused a stray bullet dot to linger
            // next to (or above) the new checkboxes.
            Array.from(node.childNodes).forEach(child => appendNode(child));
            return;
          }

          // Inline formatting (strong, em, span, a, etc.) is kept intact.
          const clone = node.cloneNode(true);

          // If the inline element contains a BR, split it while preserving
          // formatting as much as possible.
          if (clone.querySelector && clone.querySelector('br')) {
            const parts = clone.innerHTML.split(/<br\s*\/?>/i);
            parts.forEach((part, index) => {
              if (part) {
                const holder = document.createElement(clone.tagName);
                Array.from(clone.attributes).forEach(attr => {
                  holder.setAttribute(attr.name, attr.value);
                });
                holder.innerHTML = part;
                current.appendChild(holder);
              }
              if (index < parts.length - 1) {
                pushLine();
              }
            });
          } else {
            current.appendChild(clone);
          }
        };

        Array.from(wrapper.childNodes).forEach(node => appendNode(node));

        if (current.childNodes.length > 0) {
          lines.push(current);
        }

        if (!lines.length) {
          return [document.createDocumentFragment()];
        }

        // Selection boundaries often pick up an empty leading or trailing
        // line (e.g. right after toggling a bullet list off, or when the
        // selection touches a block edge). Google Docs would never show an
        // empty checkbox for that - drop them, but always keep at least one
        // line so an intentional empty click still inserts a single box.
        const isLineEmpty = (line) => !line.textContent || !line.textContent.trim();

        while (lines.length > 1 && isLineEmpty(lines[0])) {
          lines.shift();
        }
        while (lines.length > 1 && isLineEmpty(lines[lines.length - 1])) {
          lines.pop();
        }

        return lines;
      }

      if (checkboxTool) {
        checkboxTool.addEventListener('mousedown', (event) => {
          // Save the selection before focus moves to the toolbar.
          saveEditorSelection();
          event.preventDefault();
        });

        checkboxTool.addEventListener('click', () => {
          contentInput.focus();

          let range = savedCheckboxRange;
          const selection = window.getSelection();

          if (!range && selection && selection.rangeCount > 0) {
            range = selection.getRangeAt(0).cloneRange();
          }

          if (!range || !contentInput.contains(range.commonAncestorContainer)) {
            range = document.createRange();
            range.selectNodeContents(contentInput);
            range.collapse(false);
          }

          // Google-Docs-style toggle: if the selection is already entirely
          // inside checklist item(s), clicking the button again removes the
          // checklist formatting instead of nesting another one inside it.
          const startItem = getCheckboxItemFromNode(range.startContainer);
          const endItem = getCheckboxItemFromNode(range.endContainer);

          if (startItem && endItem) {
            const spanned = [];
            let node = startItem;
            while (node) {
              spanned.push(node);
              if (node === endItem) break;
              node = node.nextElementSibling;
            }

            if (spanned[spanned.length - 1] === endItem) {
              let lastNormal = null;
              spanned.forEach((checkItem) => {
                lastNormal = convertCheckboxToNormalParagraph(checkItem);
              });

              savedCheckboxRange = null;
              note.content = contentInput.innerHTML;
              saveNotes();
              if (lastNormal) placeCaretAtEnd(lastNormal);
              contentInput.focus();
              return;
            }
          }

          const selectedContents = range.cloneContents();
          const lines = splitSelectedContentIntoLines(selectedContents);

          // Remove the selected text once, then replace it with one
          // checkbox item for every selected line.
          range.deleteContents();

          const replacement = document.createDocumentFragment();
          const items = [];

          lines.forEach(lineFragment => {
            const item = createCheckboxItem(lineFragment);
            replacement.appendChild(item);
            items.push(item);
          });

          range.insertNode(replacement);

          // Put the caret at the end of the last checkbox label.
          const lastItem = items[items.length - 1];
          const lastText = lastItem.querySelector('.checkbox-text');
          const caretRange = document.createRange();
          caretRange.selectNodeContents(lastText);
          caretRange.collapse(false);

          selection.removeAllRanges();
          selection.addRange(caretRange);

          savedCheckboxRange = null;
          note.content = contentInput.innerHTML;
          saveNotes();
          contentInput.focus();
        });
      }

      // Save note content whenever a checkbox is toggled or its label is edited.
      contentInput.addEventListener('change', (event) => {
        if (event.target.matches('.editor-check-item input[type="checkbox"]')) {
          // A checkbox's ticked state lives in the DOM `checked` PROPERTY,
          // not the HTML `checked` ATTRIBUTE, and only the attribute gets
          // written out by innerHTML. Without this, ticking a box never
          // actually persisted - it silently came back unchecked the next
          // time the note rendered (switching notes, reloading, etc).
          // Google Docs never loses checklist state, so neither should this.
          if (event.target.checked) {
            event.target.setAttribute('checked', '');
          } else {
            event.target.removeAttribute('checked');
          }
          note.content = contentInput.innerHTML;
          saveNotes();
        }
      });

      const colorTrigger = document.querySelector('[data-color-trigger]');
      const colorPalette = document.querySelector('[data-color-palette]');
      const colorPicker = document.querySelector('[data-color-picker]');

      const paletteColors = [
        // Grayscale
        ['#000000', '#434343', '#666666', '#999999', '#b7b7b7', '#cccccc', '#d9d9d9', '#efefef', '#f3f3f3', '#ffffff'],
        // Bright
        ['#980000', '#ff0000', '#ff9900', '#ffff00', '#00ff00', '#00ffff', '#4a86e8', '#0000ff', '#9900ff', '#ff00ff'],
        // Light
        ['#e6b8af', '#f4cccc', '#fce5cd', '#fff2cc', '#d9ead3', '#d0e0e3', '#c9daf8', '#cfe2f3', '#d9d2e9', '#ead1dc'],
        ['#dd7e6b', '#ea9999', '#f9cb9c', '#ffe599', '#b6d7a8', '#a2c4c9', '#a4c2f4', '#9fc5e8', '#b4a7d6', '#d5a6bd'],
        ['#cc4125', '#e06666', '#f6b26b', '#ffd966', '#93c47d', '#76a5af', '#6d9eeb', '#6fa8dc', '#8e7cc3', '#c27ba0'],
        ['#a61c00', '#cc0000', '#e69138', '#f1c232', '#6aa84f', '#45818e', '#3c78d8', '#3d85c6', '#674ea7', '#a64d79'],
        ['#85200c', '#990000', '#b45f06', '#bf9000', '#38761d', '#134f5c', '#1155cc', '#0b5394', '#351c75', '#741b47'],
        ['#5b0f00', '#660000', '#783f04', '#7f6000', '#274e13', '#0b3d45', '#1c4587', '#073763', '#20124d', '#4c1130']
      ];

      function buildColorPalette() {
        const grid = document.querySelector('[data-palette-grid]');
        if (!grid) return;

        grid.innerHTML = '';
        paletteColors.forEach((row) => {
          row.forEach((color) => {
            const swatch = document.createElement('button');
            swatch.type = 'button';
            swatch.className = 'palette-swatch' + (color === '#ffffff' ? ' white' : '');
            swatch.style.backgroundColor = color;
            swatch.dataset.colorValue = color;
            swatch.title = color;
            swatch.setAttribute('aria-label', `Text color ${color}`);
            grid.appendChild(swatch);
          });
        });
      }

      function closeColorPalette() {
        if (colorPalette) colorPalette.classList.remove('open');
      }

      function applyTextColor(color) {
        contentInput.focus();
        document.execCommand('foreColor', false, color);
        closeColorPalette();
      }

      buildColorPalette();

      if (colorTrigger && colorPalette) {
        colorTrigger.addEventListener('click', (event) => {
          event.stopPropagation();
          colorPalette.classList.toggle('open');
        });

        colorPalette.addEventListener('mousedown', (event) => {
          // Keep the editor selection alive while choosing a color.
          if (event.target.closest('button')) {
            event.preventDefault();
          }
        });

        colorPalette.addEventListener('click', (event) => {
          const swatch = event.target.closest('[data-color-value]');
          if (swatch) {
            const value = swatch.dataset.colorValue;
            if (value === 'inherit') {
              applyTextColor('inherit');
            } else {
              applyTextColor(value);
            }
          }
        });

        document.addEventListener('click', (event) => {
          if (!colorPalette.contains(event.target) && event.target !== colorTrigger && !colorTrigger.contains(event.target)) {
            closeColorPalette();
          }
        });
      }

      const customSwatches = document.querySelectorAll('[data-custom-color]');
      customSwatches.forEach((swatch) => {
        swatch.style.backgroundColor = swatch.dataset.customColor;
      });

      const customColorAdd = document.querySelector('[data-custom-color-add]');
      if (customColorAdd && colorPicker) {
        customColorAdd.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          colorPicker.click();
        });
      }

      if (colorPicker) {
        colorPicker.addEventListener('input', (e) => {
          const color = e.target.value;
          const firstCustom = document.querySelector('[data-custom-color]');
          if (firstCustom) {
            firstCustom.dataset.customColor = color;
            firstCustom.style.backgroundColor = color;
            firstCustom.title = `Custom color ${color}`;
          }
          applyTextColor(color);
          if (colorPalette) colorPalette.classList.add('open');
        });
      }

      const styleSelect = document.querySelector('[data-style-select]');
      if (styleSelect) {
        styleSelect.addEventListener('change', (e) => {
          const value = e.target.value;
          if (value === 'default') {
            document.execCommand('formatBlock', false, 'p');
            return;
          }
          if (value === 'h1') {
            document.execCommand('formatBlock', false, 'h1');
            return;
          }
          if (value === 'h2') {
            document.execCommand('formatBlock', false, 'h2');
            return;
          }
          if (value === 'large') {
            document.execCommand('fontSize', false, '5');
            return;
          }
          if (value === 'small') {
            document.execCommand('fontSize', false, '2');
          }
        });
      }

      const themeToggle = document.querySelector('[data-theme-toggle]');
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const currentTheme = note.theme || 'dark';
          applyNoteTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });
      }

      const copyBtn = document.querySelector('[data-action="copy"]');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          const text = contentInput.innerText || contentInput.textContent || '';
          try {
            await navigator.clipboard.writeText(text);
            copyBtn.innerHTML = '<i class="fa-solid fa-check"></i>';
            setTimeout(() => {
              copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>';
            }, 1000);
          } catch (error) {
            console.log('Copy failed', error);
          }
        });
      }
    }

    function createNewNote() {
      const newNote = {
        id: Date.now().toString(),
        title: 'New File',
        content: '',
        createdAt: new Date().toISOString(),
        theme: 'dark',
        fontSize: 12,
        parentId: null
      };
      // New notes go after every existing note, not to the top of the list.
      notes.push(newNote);
      saveNotes();
      setActiveNote(newNote.id);
    }

    function createSubNote(parentId) {
      const parent = notes.find(n => n.id === parentId);
      if (!parent) return;

      const newSubNote = {
        id: Date.now().toString(),
        title: 'New Sub-note',
        content: '',
        createdAt: new Date().toISOString(),
        theme: 'dark',
        fontSize: 12,
        parentId: parentId
      };

      // Insert after the parent's last existing sub-note (or right after
      // the parent itself if it has none yet), so new sub-notes also land
      // after the old ones rather than jumping to the front.
      const siblings = notes.filter(n => n.parentId === parentId);
      const insertAfterId = siblings.length ? siblings[siblings.length - 1].id : parentId;
      const insertAt = notes.findIndex(n => n.id === insertAfterId) + 1;
      notes.splice(insertAt, 0, newSubNote);

      saveNotes();
      setActiveNote(newSubNote.id);
    }

    function setActiveNote(id) {
      activeNoteId = id;
      renderNotesList();
      renderEditor();
    }

    function deleteNote(id) {
      if (confirm('Are you sure you want to delete this note?')) {
        // Deleting a note also removes its sub-notes, so none are left
        // orphaned in the list.
        const idsToDelete = new Set([id, ...notes.filter(n => n.parentId === id).map(n => n.id)]);
        notes = notes.filter(n => !idsToDelete.has(n.id));
        saveNotes();
        if (idsToDelete.has(activeNoteId)) {
          activeNoteId = notes.length > 0 ? notes[0].id : null;
        }
        renderNotesList();
        renderEditor();
      }
    }

    addNoteBtn.addEventListener('click', createNewNote);

    notes = notes.map(note => ({
      ...note,
      content: String(note.content || '').includes('and white and black') ? '' : note.content || '',
      title: note.title || 'New File',
      theme: note.theme || 'dark',
      fontSize: note.fontSize || 12,
      parentId: note.parentId || null
    }));

    if (!notes.length) {
      notes = [{
        id: 'default-note',
        title: 'New File',
        content: '',
        createdAt: new Date().toISOString(),
        theme: 'dark',
        fontSize: 12,
        parentId: null
      }];
      saveNotes();
    }

    // Initial render
    if (notes.length > 0) {
      setActiveNote(notes[0].id);
    } else {
      renderNotesList();
      renderEditor();
    }
  </script>
</body>

</html>
